<style>
:root{--bg:#060913;--plate:#0B1120;--panel:#111a2e;--panel2:#18233c;--line:#223052;--ink:#E9EEF8;--dim:#8592AD;--accent:#FFC94D;--accent-ink:#1d1402;--danger:#FF4D5E;
--disp:"Chakra Petch","Arial Narrow",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;padding-inline:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:520px;height:100dvh;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding-inline:16px;padding-block:10px 14px;
 background:radial-gradient(120% 70% at 50% 35%,#0e1830 0%,var(--bg) 70%)}
.hud{display:grid;grid-template-columns:44px 1fr auto 44px;align-items:center;gap:10px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:20px;height:20px}
.ib:focus-visible,.btn:focus-visible,.tool:focus-visible,.lv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lvl{font-family:var(--disp);line-height:1}
.lvl .k{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.lvl .n{font-size:26px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-top:3px}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;padding:3px 7px 2px;border-radius:5px;background:var(--danger);color:#fff}
.tag.hide{display:none}
.moves{font-family:var(--disp);text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 14px 4px;min-width:84px}
.moves b{display:block;font-size:28px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.moves span{font-size:10px;letter-spacing:.16em;color:var(--dim)}
.moves.low{border-color:var(--danger)} .moves.low b{color:var(--danger);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.tip{min-height:40px;display:grid;place-items:center;text-align:center;font-size:15px;color:var(--ink);padding:6px 8px;font-weight:500}
.tip em{font-style:normal;color:var(--accent)}
#stage{position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:8px}
.tool{position:relative;height:58px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.tool svg{width:20px;height:20px}
.tool .cnt{position:absolute;top:-7px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.tool[disabled]{opacity:.4;cursor:default}
.par{font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--dim);text-align:center;margin-top:2px}
/* overlays */
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,6,14,.72);backdrop-filter:blur(3px);z-index:5;padding-inline:20px}
.card{width:min(100%,380px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h2{font-family:var(--disp);font-weight:700;font-size:34px;letter-spacing:.04em;margin:0 0 4px;line-height:1.05}
.card p{margin:0 0 16px;color:var(--dim);font-size:15px;line-height:1.45}
.card.win h2{color:var(--accent)} .card.fail h2{color:var(--danger)}
.btns{display:grid;gap:10px}
.btn{height:54px;border-radius:14px;border:0;font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn .sub{font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;opacity:.75}
.ad{font-family:var(--disp);font-size:13px;letter-spacing:.14em;color:var(--dim)}
.ad b{display:block;font-size:54px;color:var(--ink);margin:6px 0}
.menu .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 16px}
.lv{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-family:var(--disp);font-weight:700;font-size:17px;cursor:pointer;position:relative}
.lv.done{border-color:#2b6b4f;color:#8ff0c0}
.lv.cur{border-color:var(--accent);color:var(--accent)}
.lv.hard::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:3px;background:var(--danger)}
.lv[disabled]{opacity:.3;cursor:default}
.small{font-size:12.5px;color:var(--dim);margin-top:12px;line-height:1.5}
.linkish{background:none;border:0;color:var(--dim);font-family:var(--body);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
textarea.log{width:100%;height:120px;background:var(--bg);color:var(--dim);border:1px solid var(--line);border-radius:10px;font-size:11px;padding:8px;margin-top:8px}
@media (prefers-reduced-motion:reduce){.moves.low b{animation:none}}

<script>
// ---- Lumen engine (shared by game + generator) ----
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]]; // 0 right,1 down,2 left,3 up
function dirIdx(dx,dy){for(let i=0;i<4;i++)if(DIRS[i][0]===dx&&DIRS[i][1]===dy)return i;return -1}
// piece orientation bit: 0 = '/', 1 = '\'
function reflect(d,o){const[dx,dy]=DIRS[d];return o===0?dirIdx(-dy,-dx):dirIdx(dy,dx)}
// level: {w,h,cells:[{x,y,t,...}]}. t: wall, emit{c,d}, recv{c}, bomb, tint{c}, mir{o0,g,lock}, split{o0,g}
function prep(L){
  const grid=new Array(L.w*L.h).fill(null);const rot=[];const recv=[];const emit=[];
  for(const c of L.cells){grid[c.y*L.w+c.x]=c;
    if(c.t==='mir'&&!c.lock||c.t==='split'){c.ri=rot.length;rot.push(c)}
    if(c.t==='recv'){c.rci=recv.length;recv.push(c)}
    if(c.t==='emit')emit.push(c)}
  // groups: taps toggle every piece sharing g (g undefined => own group)
  const groups=[];const gmap={};
  rot.forEach((p,i)=>{const key=p.g!=null?'g'+p.g:'i'+i;if(gmap[key]==null){gmap[key]=groups.length;groups.push(0)}groups[gmap[key]]|=(1<<i);p.gi=gmap[key]});
  let start=0;rot.forEach((p,i)=>{if(p.o0)start|=1<<i});
  return {L,grid,rot,recv,emit,groups,start};
}
function orient(P,c,state){if(c.t==='mir'&&c.lock)return c.o0;return (state>>c.ri)&1}
function trace(P,state,wantSeg){
  const {L,grid}=P;const hits=new Array(P.recv.length).fill(0);let bomb=null;const segs=wantSeg?[]:null;
  const seen=new Set();const stack=[];
  for(const e of P.emit)stack.push([e.x,e.y,e.d,e.c,e.x,e.y]);
  let guard=0;
  while(stack.length&&guard++<4000){
    let [x,y,d,m,sx,sy]=stack.pop();
    while(true){
      const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
      if(nx<0||ny<0||nx>=L.w||ny>=L.h){if(segs)segs.push([sx,sy,x+DIRS[d][0]*0.5,y+DIRS[d][1]*0.5,m]);break}
      x=nx;y=ny;const c=grid[y*L.w+x];
      const k=(y*L.w+x)*32+d*8+m;
      if(!c){ if(seen.has(k))break; seen.add(k); continue }
      if(c.t==='wall'||c.t==='emit'){if(segs)segs.push([sx,sy,x-DIRS[d][0]*0.5,y-DIRS[d][1]*0.5,m]);break}
      if(c.t==='recv'){hits[c.rci]|=m;if(segs)segs.push([sx,sy,x,y,m]);break}
      if(c.t==='bomb'){bomb=bomb||[x,y];if(segs)segs.push([sx,sy,x,y,m]);break}
      if(seen.has(k))break;seen.add(k);
      if(segs)segs.push([sx,sy,x,y,m]);sx=x;sy=y;
      if(c.t==='tint'){m=c.c;continue}
      if(c.t==='mir'){d=reflect(d,orient(P,c,state));continue}
      if(c.t==='split'){stack.push([x,y,reflect(d,orient(P,c,state)),m,x,y]);continue}
    }
  }
  let lit=0;P.recv.forEach((r,i)=>{if(hits[i]===r.c)lit++});
  return {hits,bomb,segs,lit,solved:!bomb&&lit===P.recv.length};
}
// full analysis over reachable states (group toggles); returns dist-to-goal map
function analyze(P){
  const G=P.groups;const dist=new Map();const status=new Map();
  const st=s=>{if(!status.has(s)){const t=trace(P,s,false);status.set(s,t.bomb?2:t.solved?1:0)}return status.get(s)};
  // forward BFS to enumerate reachable states from start (bombs are dead ends)
  const reach=[P.start];const seen=new Set([P.start]);
  for(let i=0;i<reach.length;i++){const s=reach[i];if(st(s)===2)continue;for(const g of G){const n=s^g;if(!seen.has(n)){seen.add(n);reach.push(n)}}}
  // reverse BFS from goals over non-bomb states
  const q=[];for(const s of reach)if(st(s)===1){dist.set(s,0);q.push(s)}
  for(let i=0;i<q.length;i++){const s=q[i];for(const g of G){const n=s^g;if(seen.has(n)&&!dist.has(n)&&st(n)!==2){dist.set(n,dist.get(s)+1);q.push(n)}}}
  return {dist,status:st,reach:reach.length,goals:[...status.values()].filter(v=>v===1).length};
}

    if(G.failKind==='bomb'){const h=G.hist.pop();G.state=h.s;G.moves=h.m;G.bombAt=null;G.shake=0;resyncVis()}
    else G.moves+=3;G.over=false;G.tr=trace(G.P,G.state,true);G.lit=G.P.recv.map((r,i)=>G.tr.hits[i]===r.c);hud()}},1000)};
function resyncVis(){G.P.rot.forEach((p,i)=>{const want=((G.state>>i)&1)?45:-45;let a=G.vis[i].to;const cur=((a%180)+180)%180;const w=((want%180)+180)%180;if(cur!==w){G.vis[i].to+=90;G.vis[i].pulse=1}})}
$('bUndo').onclick=()=>{if(!G.hist.length||!prog.undo||G.over)return;const h=G.hist.pop();G.state=h.s;G.moves=h.m;prog.undo--;save();resyncVis();log('booster_used',{b:'undo'});tone(600,.08,'triangle',.12,.6);G.tr=trace(G.P,G.state,true);G.lit=G.P.recv.map((r,i)=>G.tr.hits[i]===r.c);hud()};
$('bHint').onclick=()=>{if(!prog.hint||G.over)return;const d=G.A.dist.get(G.state);if(d==null)return;let best=-1;G.P.groups.forEach((m,gi)=>{if(best<0&&G.A.dist.get(G.state^m)===d-1)best=gi});
  if(best<0)return;prog.hint--;save();G.hintGroup=best;G.hintUntil=performance.now()+3200;log('booster_used',{b:'hint'});tone(880,.15,'sine',.1,1.2);hud()};
$('bRestart').onclick=()=>{if(G.hist.length||G.over){log('level_retry',{from:'button'});loadLevel(G.n,true)}};
$('bSnd').onclick=()=>{prog.sound=!prog.sound;save();$('sndW').style.opacity=prog.sound?1:.15;if(prog.sound)tone(660,.1)};
$('sndW').style.opacity=prog.sound?1:.15;
function menu(on){if(on){const g=$('grid');g.innerHTML='';for(let i=1;i<=LEVELS.length;i++){const b=document.createElement('button');b.className='lv'+(prog.done.includes(i)?' done':'')+(i===G.n?' cur':'')+(HARD[i]?' hard':'');b.textContent=i;
  b.disabled=!(prog.unlockAll||i<=prog.max);b.onclick=()=>{menu(false);loadLevel(i)};g.appendChild(b)}$('logBox').hidden=true}show('ovMenu',on)}
$('bMenu').onclick=()=>menu(true);$('bClose').onclick=()=>menu(false);
$('bUnlock').onclick=()=>{prog.unlockAll=true;save();menu(true)};
$('bReset').onclick=()=>{prog={cur:1,max:1,done:[],undo:3,hint:3,sound:prog.sound,unlockAll:false};save();LOG=[];store.set('log',LOG);menu(false);loadLevel(1)};
$('bLog').onclick=()=>{const txt=JSON.stringify({game:'lumen-relay-proto',exported:new Date().toISOString(),events:LOG});const box=$('logBox');box.value=txt;box.hidden=false;box.select();
  try{navigator.clipboard.writeText(txt).then(()=>{$('bLog').textContent='Copied '+LOG.length+' events'},()=>{$('bLog').textContent='Select the text below to copy'})}catch(e){$('bLog').textContent='Select the text below to copy'}};
// ---------- particles ----------
function burst(x,y,c,n,sp=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(1+Math.random()*3)*sp;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c,r:1.5+Math.random()*2.5})}}
// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function hex(x,y,r){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath()}
function glyph(m,x,y,s,col){ctx.fillStyle=col;const parts=[1,2,4].filter(b=>m&b);const n=parts.length;parts.forEach((b,i)=>{const gx=x+(i-(n-1)/2)*s*1.25;ctx.beginPath();
  if(b===1){ctx.moveTo(gx,y-s*.55);ctx.lineTo(gx+s*.55,y+s*.45);ctx.lineTo(gx-s*.55,y+s*.45);ctx.closePath()}else if(b===2){ctx.arc(gx,y,s*.48,0,Math.PI*2)}else{ctx.rect(gx-s*.43,y-s*.43,s*.86,s*.86)}ctx.fill()})}
let tPrev=performance.now();
function frame(now){const dt=Math.min(50,now-tPrev);tPrev=now;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);if(!G.P){requestAnimationFrame(frame);return}
  const L=G.P.L;
  let sx=0,sy=0;if(G.shake>0){G.shake=Math.max(0,G.shake-dt/450);if(!RM){sx=(Math.random()-.5)*14*G.shake;sy=(Math.random()-.5)*14*G.shake}}
  ctx.save();ctx.translate(sx,sy);
  // plate
  rr(OX-6,OY-6,CS*L.w+12,CS*L.h+12,18);ctx.fillStyle='#0B1120';ctx.fill();ctx.strokeStyle='#1B2745';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#22304F';for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){ctx.beginPath();ctx.arc(px(x),py(y),1.4,0,Math.PI*2);ctx.fill()}
  // walls & tints (under beams)
  for(const c of L.cells){const X=px(c.x),Y=py(c.y),h=CS*.44;
    if(c.t==='wall'){rr(X-h,Y-h,h*2,h*2,6);ctx.fillStyle='#1A2338';ctx.fill();ctx.strokeStyle='#2A3656';ctx.stroke();ctx.save();ctx.clip();ctx.strokeStyle='#243050';ctx.lineWidth=2;for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(X-h+k*h*.7,Y+h);ctx.lineTo(X+h+k*h*.7,Y-h);ctx.stroke()}ctx.restore()}
    if(c.t==='tint'){ctx.save();ctx.translate(X,Y);ctx.rotate(Math.PI/4);rr(-h*.62,-h*.62,h*1.24,h*1.24,5);ctx.fillStyle=COL[c.c]+'33';ctx.fill();ctx.strokeStyle=COL[c.c];ctx.lineWidth=2;ctx.stroke();ctx.restore()}}
  // beams
  const flow=RM?0:(now/40)%24;const segs=G.tr.segs;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(const pass of [[.42,.10],[.2,.28],[.075,.95]]){ctx.lineWidth=Math.max(1.5,CS*pass[0]);
    for(const s of segs){ctx.strokeStyle=COL[s[4]];ctx.globalAlpha=pass[1];ctx.beginPath();ctx.moveTo(px(s[0]),py(s[1]));ctx.lineTo(px(s[2]),py(s[3]));ctx.stroke()}}
  ctx.globalAlpha=.9;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,CS*.03);ctx.setLineDash([CS*.12,CS*.3]);ctx.lineDashOffset=-flow*CS/24*2;
  for(const s of segs){ctx.beginPath();ctx.moveTo(px(s[0]),py(s[1]));ctx.lineTo(px(s[2]),py(s[3]));ctx.stroke()}
  ctx.restore();
  // pieces
  const hinting=now<G.hintUntil;
  G.P.rot.forEach((p,i)=>{const v=G.vis[i];v.a+=(v.to-v.a)*Math.min(1,dt/60);if(Math.abs(v.to-v.a)<.5)v.a=v.to;v.pulse=Math.max(0,v.pulse-dt/300);
    const X=px(p.x),Y=py(p.y),r=CS*.42;
    ctx.beginPath();ctx.arc(X,Y,r,0,Math.PI*2);ctx.fillStyle='#141D33';ctx.fill();ctx.lineWidth=2;
    ctx.strokeStyle=p.g!=null?'#FFC94D':'#34436A';ctx.stroke();
    if(v.pulse>0){ctx.beginPath();ctx.arc(X,Y,r+(1-v.pulse)*CS*.2,0,Math.PI*2);ctx.strokeStyle=`rgba(255,255,255,${v.pulse*.5})`;ctx.stroke()}
    if(hinting&&p.gi===G.hintGroup){const k=(Math.sin(now/120)+1)/2;ctx.beginPath();ctx.arc(X,Y,r+4+k*6,0,Math.PI*2);ctx.strokeStyle='#FFC94D';ctx.lineWidth=3;ctx.stroke()}
    if(G.n===1&&!G.hist.length&&!G.over){const k=(now%1400)/1400;ctx.beginPath();ctx.arc(X,Y,r+k*CS*.5,0,Math.PI*2);ctx.strokeStyle=`rgba(255,201,77,${1-k})`;ctx.lineWidth=3;ctx.stroke()}
    ctx.save();ctx.translate(X,Y);ctx.rotate(v.a*Math.PI/180);
    if(p.t==='mir'){const len=r*.95;const gr=ctx.createLinearGradient(0,-4,0,4);gr.addColorStop(0,'#F4F7FF');gr.addColorStop(1,'#8E9BBB');ctx.fillStyle=gr;rr(-len,-CS*.045,len*2,CS*.09,CS*.04);ctx.fill();ctx.fillStyle='#5B6A8F';ctx.fillRect(-len*.9,CS*.045,len*1.8,CS*.035)}
    else{const len=r*.95;ctx.setLineDash([4,3]);ctx.strokeStyle='#BFE9FF';ctx.lineWidth=CS*.05;ctx.beginPath();ctx.moveTo(-len,0);ctx.lineTo(len,0);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(120,200,255,.25)';rr(-len,-CS*.07,len*2,CS*.14,3);ctx.fill()}
    ctx.restore();
    if(p.g!=null){ctx.fillStyle='#FFC94D';ctx.font=`700 ${Math.round(CS*.22)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(GLYPH[p.g%3],X+r*.78,Y-r*.78)}
  });
  // receivers
  G.P.recv.forEach((r,i)=>{const X=px(r.x),Y=py(r.y),R=CS*.4,col=COL[r.c],lit=G.lit[i];
    if(lit){const k=(Math.sin(now/220+i)+1)/2;ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(X,Y,0,X,Y,R*2.2);g.addColorStop(0,col+'aa');g.addColorStop(1,col+'00');ctx.fillStyle=g;ctx.globalAlpha=.6+.4*k;ctx.fillRect(X-R*2.4,Y-R*2.4,R*4.8,R*4.8);ctx.restore()}
    hex(X,Y,R);ctx.fillStyle=lit?col:'#0F1628';ctx.fill();ctx.lineWidth=3;
    const parts=[1,2,4].filter(b=>r.c&b);if(parts.length>1&&!lit){parts.forEach((b,j)=>{ctx.save();hex(X,Y,R);ctx.clip();ctx.beginPath();ctx.moveTo(X,Y);ctx.arc(X,Y,R*1.2,j*2*Math.PI/parts.length-Math.PI/2,(j+1)*2*Math.PI/parts.length-Math.PI/2);ctx.closePath();ctx.fillStyle=COL[b]+'30';ctx.fill();ctx.restore()})}
    hex(X,Y,R);ctx.strokeStyle=col;ctx.stroke();hex(X,Y,R*.62);ctx.strokeStyle=lit?'#ffffffaa':col+'55';ctx.lineWidth=1.5;ctx.stroke();
    glyph(r.c,X,Y,CS*.16,lit?'#0B1120':col);
    const got=G.tr.hits[i];if(got&&!lit){ctx.beginPath();ctx.arc(X+R*.8,Y-R*.8,CS*.09,0,Math.PI*2);ctx.fillStyle='#FF4D5E';ctx.fill()}
  });
  // emitters
  for(const e of G.P.emit){const X=px(e.x),Y=py(e.y),h=CS*.4,col=COL[e.c];ctx.save();ctx.translate(X,Y);ctx.rotate(e.d*Math.PI/2);
    rr(-h,-h,h*2,h*2,CS*.12);ctx.fillStyle='#172038';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle=col;rr(h*.35,-h*.28,h*.9,h*.56,4);ctx.fill();ctx.beginPath();ctx.arc(-h*.15,0,h*.3,0,Math.PI*2);ctx.fill();ctx.restore();glyph(e.c,X-Math.cos(e.d*Math.PI/2)*h*.15,Y-Math.sin(e.d*Math.PI/2)*h*.15,CS*.12,'#0B1120')}
  // bombs
  for(const c of L.cells){if(c.t!=='bomb')continue;const X=px(c.x),Y=py(c.y),R=CS*.33;const hit=G.bombAt&&G.bombAt[0]===c.x&&G.bombAt[1]===c.y;if(hit&&G.shake<.9)continue;
    const k=(Math.sin(now/260+c.x)+1)/2;ctx.beginPath();ctx.arc(X,Y,R+3+k*3,0,Math.PI*2);ctx.strokeStyle=`rgba(255,77,94,${.25+.35*k})`;ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(X,Y,R,0,Math.PI*2);ctx.fillStyle='#1B1016';ctx.fill();ctx.strokeStyle='#FF4D5E';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(X,Y,R*.38,0,Math.PI*2);ctx.fillStyle=`rgb(255,${70+80*k},${60})`;ctx.fill();
    ctx.fillStyle='#FF4D5E';ctx.font=`700 ${Math.round(CS*.2)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',X,Y-R-CS*.12)}
  // win sweep
  if(G.winT){const k=Math.min(1,(now-G.winT)/700);ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(255,240,200,${.18*(1-k)})`;ctx.fillRect(OX,OY,CS*L.w,CS*L.h);ctx.restore()}
  // particles
  ctx.save();ctx.globalCompositeOperation='lighter';G.parts=G.parts.filter(p=>(p.life-=dt/800)>0);for(const p of G.parts){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vx*=.96;p.vy*=.96;ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.restore();
  ctx.restore();
  requestAnimationFrame(frame)}
loadLevel(Math.min(prog.cur||1,LEVELS.length));requestAnimationFrame(frame);
document.addEventListener('keydown',e=>{if(e.key==='z'&&(e.ctrlKey||e.metaKey))$('bUndo').click();if(e.key==='r')$('bRestart').click()});
})();

</script>
