  ctx.fillStyle = 'rgba(3,5,15,0.34)';
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, -Math.PI * 0.25, Math.PI * 0.72);
  ctx.fill();

  // Rim light
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r - 0.7, 0, TAU); ctx.stroke();

  // Pulsar core beacon
  if (p.type === 'pulsar') {
    ctx.globalCompositeOperation = 'lighter';
    const b = 0.4 + 0.6 * Math.abs(Math.sin(t * 3.4 + p.pulse));
    ctx.fillStyle = 'rgba(124,255,212,' + (0.35 * b) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.1 + 0.25 * b), 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawRock(k) {
  ctx.save();
  ctx.translate(k.x, k.y);
  ctx.rotate(k.spin);
  ctx.beginPath();
  const n = k.pts.length;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    const r = k.r * k.pts[i];
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#141A33';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,77,109,0.85)';
  ctx.lineWidth = 2.2;
  ctx.stroke();
  ctx.restore();
}

function drawOrb(o, t) {
  if (o.got) return;
  const b = Math.sin(t * 3 + o.bob);
  const r = 7 + b * 1.4;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(124,255,212,0.2)';
  ctx.beginPath(); ctx.arc(o.x, o.y, r * 2.4, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#7CFFD4';
  ctx.beginPath(); ctx.arc(o.x, o.y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(o.x - r * 0.25, o.y - r * 0.25, r * 0.34, 0, TAU); ctx.fill();
}

function drawPower(pw, t) {
  if (pw.got) return;
  const P = POWERS[pw.kind];
  const b = Math.sin(t * 2.6 + pw.bob);
  const r = 21 + b * 2.2;
  ctx.save();
  ctx.translate(pw.x, pw.y);

  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 3.4);
  g.addColorStop(0, P.color + '77');
  g.addColorStop(0.45, P.color + '33');
  g.addColorStop(1, P.color + '00');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r * 3.4, 0, TAU); ctx.fill();

  // Counter-rotating dashed ring — motion is what makes it catch the eye.
  ctx.strokeStyle = P.color;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1.6;
  ctx.setLineDash([6, 9]);
  ctx.lineDashOffset = t * 34;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.85, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // Rotating hex frame — a silhouette no planet or orb shares.
  ctx.rotate(t * 0.85 + pw.spin);
  ctx.strokeStyle = P.color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.rotate(-(t * 0.85 + pw.spin));

  // Glyph: ring / bar / arrow — readable at thumbnail size.
  ctx.fillStyle = P.color;
  ctx.strokeStyle = P.color;
  if (pw.kind === 'shield') {
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.stroke();
  } else if (pw.kind === 'coolant') {
    ctx.fillRect(-r * 0.46, -r * 0.14, r * 0.92, r * 0.28);
  } else {
    ctx.beginPath();
    ctx.moveTo(r * 0.46, 0); ctx.lineTo(-r * 0.3, r * 0.4); ctx.lineTo(-r * 0.3, -r * 0.4);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawTrail() {
  const n = ship.trail.length;
  if (n < 2) return;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const bandOf = pt => pt.age >= TRAIL_ARM ? 2 : (pt.age >= TRAIL_ARM * 0.72 ? 1 : 0);
  const chilled = run.coolant > 0;
  const BLOOM = ['rgba(92,225,230,0.085)', 'rgba(242,161,92,0.085)',
                 chilled ? 'rgba(180,124,255,0.10)' : 'rgba(255,77,109,0.10)'];
  const CORE  = ['rgba(92,225,230,', 'rgba(242,161,92,',
                 chilled ? 'rgba(180,124,255,' : 'rgba(255,90,122,'];

  // Pass 1 — soft bloom, stroked as ONE continuous path per band. Drawing it
  // as a single path (rather than per-segment) is what stops every sample
  // point from stacking its own round cap into a white bead.
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = TRAIL_R * 3.4;
  for (let band = 0; band < 3; band++) {
    ctx.strokeStyle = BLOOM[band];
    ctx.beginPath();
    let open = false;
    for (let i = 0; i < n; i++) {
      const pt = ship.trail[i];
      if (bandOf(pt) !== band) { open = false; continue; }
      if (open) ctx.lineTo(pt.x, pt.y);
      else { ctx.moveTo(pt.x, pt.y); open = true; }
    }
    ctx.stroke();
  }

  // Pass 2 — the solid core, also stroked as one continuous path per band.
  // Constant width and opacity per band is deliberate: the wake is equally
  // lethal at every age, so it must not read as fading out.
  ctx.globalCompositeOperation = 'source-over';
  const WIDTH = [TRAIL_R * 1.5, TRAIL_R * 1.6, TRAIL_R * 1.9];
  for (let band = 0; band < 3; band++) {
    ctx.strokeStyle = CORE[band] + '0.92)';
    ctx.lineWidth = WIDTH[band];
    ctx.beginPath();
    let open = false;
    for (let i = 0; i < n; i++) {
      const pt = ship.trail[i];
      if (bandOf(pt) !== band) { open = false; continue; }
      if (open) ctx.lineTo(pt.x, pt.y);
      else { ctx.moveTo(pt.x, pt.y); open = true; }
    }
    ctx.stroke();
  }
}

function drawShip(t) {
  if (run.state === STATE.DEAD) return;
  const blink = run.invuln > 0 && Math.floor(t * 18) % 2 === 0;

  // Tether line to the held planet
  if (ship.attached) {
    const p = ship.attached;
    ctx.strokeStyle = ship.grazing ? 'rgba(242,161,92,0.5)' : 'rgba(92,225,230,0.32)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 7]);
    ctx.lineDashOffset = -t * 30;
    ctx.beginPath(); ctx.moveTo(ship.x, ship.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);

  if (run.shield) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(159,232,255,' + (0.5 + 0.28 * Math.sin(t * 5)) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, SHIP_R * 2.5, 0, TAU); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  if (!blink) {
    // Glow
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, SHIP_R * 4.2);
    g.addColorStop(0, 'rgba(150,240,255,0.5)');
    g.addColorStop(1, 'rgba(150,240,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, SHIP_R * 4.2, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // Hull
    ctx.beginPath();
    ctx.moveTo(SHIP_R * 1.75, 0);
    ctx.lineTo(-SHIP_R * 1.05, SHIP_R * 0.92);
    ctx.lineTo(-SHIP_R * 0.42, 0);
    ctx.lineTo(-SHIP_R * 1.05, -SHIP_R * 0.92);
    ctx.closePath();
    ctx.fillStyle = '#F3EDE4';
    ctx.fill();
    ctx.strokeStyle = ship.grazing ? '#F2A15C' : '#5CE1E6';
    ctx.lineWidth = 1.8;
    ctx.stroke();
  }
  ctx.restore();
}

function drawParts() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const a = 1 - p.age / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawEdgeWarning() {
  if (run.state !== STATE.PLAY) return;
  const leftEdge = cam.x - view.wW * 0.5;
  const room = (ship.x - leftEdge) / (view.wW * 0.2);
  const danger = clamp(1 - room, 0, 1);
  if (danger <= 0.02) return;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, view.w * 0.34, 0);
  g.addColorStop(0, 'rgba(255,77,109,' + (0.5 * danger) + ')');
  g.addColorStop(1, 'rgba(255,77,109,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, view.w * 0.34, view.h);
}

function drawFlash() {
  if (run.flash <= 0) return;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = 'rgba(255,255,255,' + (run.flash * 0.35) + ')';
  ctx.fillRect(0, 0, view.w, view.h);
}

function render(t) {
  drawBackground();
  drawStars(t);
  worldToScreen();

  drawOutOfBounds();
  drawRails(t);
  for (const pr of world.pairs) {
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([4, 8]);
    ctx.beginPath(); ctx.moveTo(pr.a.x, pr.a.y); ctx.lineTo(pr.b.x, pr.b.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(pr.cx, pr.cy, 2.6, 0, TAU); ctx.fill();
  }
  drawBestMarker(t);
  for (const p of world.planets) drawPlanet(p, t);
  for (const q of world.pads) {
    const y = q.side * HALF_H;
    const glow = q.hit;
    ctx.globalCompositeOperation = 'lighter';
    const pg = ctx.createLinearGradient(0, y, 0, y - q.side * 54);
    pg.addColorStop(0, 'rgba(92,225,230,' + (0.30 + glow * 0.4) + ')');
    pg.addColorStop(1, 'rgba(92,225,230,0)');
    ctx.fillStyle = pg;
    ctx.fillRect(q.x, Math.min(y, y - q.side * 54), q.w, 54);
    ctx.globalCompositeOperation = 'source-over';

    ctx.strokeStyle = 'rgba(92,225,230,' + (0.85 + glow * 0.15) + ')';
    ctx.lineWidth = 4 + glow * 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(q.x, y); ctx.lineTo(q.x + q.w, y); ctx.stroke();

    // Inward chevrons: this edge pushes you back rather than ending the run.
    ctx.strokeStyle = 'rgba(92,225,230,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let cx = q.x + 26; cx < q.x + q.w - 10; cx += 40) {
      ctx.moveTo(cx - 11, y - q.side * 4);
      ctx.lineTo(cx, y - q.side * 19);
      ctx.lineTo(cx + 11, y - q.side * 4);
    }
    ctx.stroke();
  }

  for (const g of world.gates) {
    const acc = ZONES[run.zone].accent;
    const top = g.y - g.h / 2, bot = g.y + g.h / 2;
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createLinearGradient(g.x - 40, 0, g.x + 40, 0);
    lg.addColorStop(0, acc + '00'); lg.addColorStop(0.5, acc + '33'); lg.addColorStop(1, acc + '00');
    ctx.fillStyle = lg;
    ctx.fillRect(g.x - 40, top, 80, g.h);
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = acc; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    for (const y of [top, bot]) {
      ctx.beginPath(); ctx.moveTo(g.x - 26, y); ctx.lineTo(g.x + 26, y); ctx.stroke();
    }
  }
  for (const k of world.rocks) drawRock(k);
  for (const o of world.orbs) drawOrb(o, t);
  for (const pw of world.powers) drawPower(pw, t);
  drawTrail();
  drawParts();
  drawWaves();
  drawShip(t);

  drawEdgeWarning();
  drawFlash();
}

/* =========================================================
   14. HUD SYNC
   ========================================================= */

const hudEls = { score: el('score'), dist: el('dist'), combo: el('combo') };
let hudScore = 0;

// Three static pills, toggled and re-filled each frame — no innerHTML churn.
const pills = {};
for (const k of POWER_KEYS) {
  const d = document.createElement('div');
  d.className = 'pw';
  d.style.color = POWERS[k].color;
  d.style.display = 'none';
  d.innerHTML = '<span>' + POWERS[k].label + '</span><i class="bar"></i>';
  el('powers').appendChild(d);
  pills[k] = { el: d, bar: d.querySelector('.bar') };
}

function syncPowers() {
  for (const k of POWER_KEYS) {
    const on = k === 'shield' ? run.shield : run[k] > 0;
    const active = on && run.state === STATE.PLAY && !run.awaitFirst;
    pills[k].el.style.display = active ? '' : 'none';
    if (!active) continue;
    const frac = k === 'shield' ? 1 : run[k] / POWERS[k].dur;
    pills[k].bar.style.width = (frac * 100).toFixed(1) + '%';
  }
}

function syncHUD(dt) {
  hudScore = lerp(hudScore, run.score, 1 - Math.exp(-9 * dt));
  if (Math.abs(hudScore - run.score) < 1) hudScore = run.score;
  hudEls.score.textContent = Math.round(hudScore).toLocaleString();
  hudEls.dist.textContent = Math.floor(run.metres).toLocaleString() + ' m';

  syncPowers();

  const m = multiplier();
  if (run.combo >= 3 && run.state === STATE.PLAY) {
    hudEls.combo.textContent = 'CHAIN ' + run.combo + '  ×' + m.toFixed(1);
    hudEls.combo.classList.add('on');
  } else {
    hudEls.combo.classList.remove('on');
  }
}

/* =========================================================
   15. KERNEL HOOKS — everything the shared loop asks of this game
   ========================================================= */

Object.assign(G, {
  overDelay: 650,
  resumeInvuln: 0.45,
  dim: 'rgba(154,147,184,.4)',
  banner: { box: 'flag', text: 'flagtext', color: 'var(--amber)', shadow: '#F2A15C', ms: 1500, pop: true },

  layout() {
    // Guarantee a minimum vertical AND horizontal sightline on any aspect ratio.
    view.scale = Math.min(view.h / TARGET_VIS_H, view.w / MIN_VIEW_W);
    view.wW = view.w / view.scale;
    view.wH = view.h / view.scale;
    // A phone sees a tall, narrow slice. Left alone that means twice the vertical
    // ground to cover with half the forward sight — a different, much harder game.
    // Cap the corridor against the visible WIDTH, and scale speed so the time to
    // cross the screen is the same on every device.
    HALF_H = clamp(Math.min(view.wH * 0.84, view.wW * 0.95), RAIL_MIN, RAIL_MAX) / 2;
    SPEED_SCALE = clamp(view.wW / 1700, 0.62, 1);
    checkOrientation();
  },
  blocked() { return blocked; },

  reset() {
    run.zone = 0; run.zonePrev = 0; run.zoneFade = 1; run.deepCycle = 0;
    run.rampM = 0; run.rampHoldUntil = 0;
    setPalette(ZONES[0], ZONES[0], 1, 1);
    resetWorld();
    ship.x = 130; ship.y = 0; ship.angle = 0;
    ship.speed = BASE_SPEED * SPEED_SCALE;
    ship.attached = null;
    ship.lockout = null;
    ship.trail.length = 0;
    ship.trailT = 0;
    ship.grazing = false;
    ship.loopArc = 0;

    run.metres = 0; run.combo = 0; run.freeTime = 0; run.invuln = 0.6;
    run.newBestHit = false;
    run.shield = false; run.coolant = 0; run.overdrive = 0; run.nextMile = MILESTONE;

    cam.x = 0; cam.y = 0;
    generateAhead(view.wW * 2.2, 0);
    generatePads(view.wW * 2.4);
    el('introBest').textContent = run.best
      ? 'Best ' + run.best.toLocaleString() + (run.bestDist ? ' \u00b7 ' + run.bestDist.toLocaleString() + ' m' : '') : '';
  },

  decay(dt) {
    for (const p of world.planets) p.glow = Math.max(0, p.glow - dt * 3.4);
    for (const q of world.pads) if (q.hit > 0) q.hit = Math.max(0, q.hit - dt * 2.2);
  },
  idle(dt, clock) {
    // Live scene, frozen run. The ship idles on its mark until first input.
    ship.y = Math.sin(clock * 1.9) * 7;
    ship.trail.length = 0;
    for (const p of world.planets) p.spin += p.spinRate * dt;
    for (const k of world.rocks) k.spin += k.spinRate * dt;
  },
  dead(dt) { cam.x += 12 * dt; },
  syncHUD: syncHUD,
  render: render,

  step(dt) {
    run.coolant = Math.max(0, run.coolant - dt);
    run.overdrive = Math.max(0, run.overdrive - dt);

    updateShip(dt);

    // Camera: follow forward only, with a creep that scales with speed.
    const targetX = ship.x + view.wW * 0.09;
    if (targetX > cam.x) cam.x = lerp(cam.x, targetX, 1 - Math.exp(-4.5 * dt));
    const creep = (0.011 + Math.min(0.032, run.metres * 0.000040)) * (ship.attached ? 0.35 : 1);
    cam.x += view.wW * creep * dt;
    cam.y = lerp(cam.y, clamp(ship.y * 0.12, -70, 70), 1 - Math.exp(-2.4 * dt));

    const prevM = run.metres;
    run.metres = cam.x / 10;
    if (run.engaged) run.score += Math.max(0, run.metres - prevM) * multiplier();

    // Zone boundary
    const zi = zoneIndexAt(run.metres);
    if (zi !== run.zone) enterZone(zi);
    if (zi === 4) {
      const cyc = Math.floor((run.metres - ZONE_AT[4]) / DEEP_LOOP);
      if (cyc !== run.deepCycle) {
        run.deepCycle = cyc;
        run.rampHoldUntil = run.metres + RAMP_HOLD;
        banner('THE DEEP \u00b7 ' + (cyc + 1), ZONES[4].accent);
        shockwave(ship.x, ship.y, { maxR: view.wW * 0.8, life: 1.1, color: ZONES[4].accent, width: 8 });
        Sound.zone();
      }
    }
    if (run.zoneFade < 1) run.zoneFade = Math.min(1, run.zoneFade + dt / ZONE_FADE);
    setPalette(ZONES[run.zonePrev], ZONES[run.zone], run.zoneFade, deepDarken());

    // Speed holds flat briefly after every boundary.
    if (run.metres >= run.rampHoldUntil) run.rampM += Math.max(0, run.metres - prevM);

    // Milestone pulse — gives a long run a rhythm instead of a flat line.
    if (run.metres >= run.nextMile) {
      const m = run.nextMile;
      run.nextMile += MILESTONE;
      if (nearBoundary(m)) { /* zone change owns this beat */ } else {
      run.score += 250 * multiplier();
      run.hitstop = 0.07;
      run.flash = 0.26;
      shockwave(ship.x, ship.y, { maxR: view.wW * 0.66, life: 0.95, color: '#5CE1E6', width: 7 });
      shockwave(ship.x, ship.y, { maxR: view.wW * 0.44, life: 0.8, color: '#B47CFF', width: 4, delay: 0.1 });
      burst(ship.x, ship.y, 22, { color: '#5CE1E6', maxSpeed: 300, maxLife: 0.85 });
      banner(Math.round(m).toLocaleString() + ' M', '#5CE1E6');
      Sound.milestone();
      }
    }

    if (!run.newBestHit && run.bestDist > 0 && run.metres > run.bestDist) {
      run.newBestHit = true;
      run.flash = 0.3;
      burst(ship.x, ship.y, 24, { color: '#F2A15C', maxSpeed: 300, maxLife: 0.9 });
      Sound.tone(700, 0.16, 'triangle', 0.2, 1200);
      Sound.tone(1050, 0.3, 'sine', 0.14, 1400);
      el('flag').classList.add('on');
      setTimeout(() => el('flag').classList.remove('on'), 1700);
    }

    for (const k of world.rocks) { k.spin += k.spinRate * dt; k.y += k.drift * dt; }
    for (const pr of world.pairs) stepPair(pr, dt);
    for (const p of world.planets) {
      p.spin += p.spinRate * dt;
      if (p.vy) {
        p.y += p.vy * dt;
        const lim = HALF_H - p.r - 70;
        if (p.y > lim) { p.y = lim; p.vy = -p.vy; }
        else if (p.y < -lim) { p.y = -lim; p.vy = -p.vy; }
      }
    }

    generateAhead(cam.x + view.wW * 1.6, run.metres);
    generatePads(cam.x + view.wW * 1.8);
    cullBehind(cam.x - view.wW * 0.9);

    checkCollisions();
  },

  wake() { Sound.startDrone(); },

  hush() { Sound.stopDrone(); },
  launch() {
    if (!sessionSeenHint) {
      sessionSeenHint = true;
      el('hint').classList.add('on');
      setTimeout(() => el('hint').classList.remove('on'), 4000);
    }
  },

  // A shield eats one impact. Falling off the back isn't an impact, so it doesn't.
  dying(cause, hitObj) {
    if (!run.shield || cause === 'Left behind') return false;
    run.shield = false;
    run.invuln = 1.4;
    run.hitstop = 0.07;
    run.shake = 0.7;
    run.flash = 0.3;
    ship.attached = null;
    ship.lockout = null;
    ship.trail.length = 0;
    // Push clear of whatever was hit so the ship doesn't re-collide on resume.
    if (hitObj) {
      const dx = ship.x - hitObj.x, dy = ship.y - hitObj.y;
      const d = Math.hypot(dx, dy) || 1;
      const safe = hitObj.r + SHIP_R + 34;
      ship.x = hitObj.x + (dx / d) * safe;
      ship.y = hitObj.y + (dy / d) * safe;
      ship.angle = Math.atan2(dy, dx);
    }
    ship.y = clamp(ship.y, -HALF_H + 100, HALF_H - 100);
    shockwave(ship.x, ship.y, { maxR: 420, life: 0.8, color: '#9FE8FF', width: 7 });
    burst(ship.x, ship.y, 26, { color: '#9FE8FF', maxSpeed: 320, maxLife: 0.8 });
    banner('SHIELD DOWN', '#9FE8FF');
    Sound.guard();
    return true;
  },
  crash() {
    ship.attached = null;
    // Impact shockwave: a hard white core, a red front, an amber echo.
    shockwave(ship.x, ship.y, { maxR: view.wW * 0.30, life: 0.55, color: '#FFFFFF', width: 4 });
    shockwave(ship.x, ship.y, { maxR: view.wW * 0.78, life: 0.95, color: '#FF4D6D', width: 9 });
    shockwave(ship.x, ship.y, { maxR: view.wW * 0.52, life: 0.85, color: '#F2A15C', width: 5, delay: 0.11 });
    burst(ship.x, ship.y, 46, { color: '#FF4D6D', maxSpeed: 420, maxLife: 1.1, minR: 1.4, maxR: 4.6 });
    burst(ship.x, ship.y, 22, { color: '#F2A15C', maxSpeed: 260, maxLife: 0.9 });
  },
  celebrate(i) {
    const a = rand(0, TAU), r = i ? rand(60, 220) : 0;
    const x = ship.x + Math.cos(a) * r, y = ship.y + Math.sin(a) * r;
    burst(x, y, 26, { color: i % 2 ? '#FFFFFF' : '#F2A15C', minSpeed: 120, maxSpeed: 360,
                      minLife: 0.6, maxLife: 1.3, maxR: 3.8, drag: 1.2 });
    shockwave(x, y, { maxR: 150 + i * 30, life: 0.6, color: '#F2A15C', width: 3 });
  },
  record() {
    const isBest = run.score > run.best;
    if (isBest) { run.best = run.score; store('perigee.best', String(run.best)); }
    if (run.metres > run.bestDist) { run.bestDist = Math.floor(run.metres); store('perigee.bestdist', String(run.bestDist)); }
    return isBest;
  },
  overPanel() {
    el('finalScore').textContent = Math.round(run.score).toLocaleString();
    el('finalDist').textContent = Math.floor(run.metres).toLocaleString() + ' m';
    el('finalChain').textContent = run.bestChain;
  },

  // Clear a safe pocket around the ship and put it back in flight.
  revive() {
    run.invuln = 1.6;
    ship.trail.length = 0;
    ship.attached = null;
    ship.y = clamp(ship.y, -HALF_H + 120, HALF_H - 120);
    ship.x = Math.max(ship.x, cam.x - view.wW * 0.2);
    ship.angle = 0;
    ship.speed = BASE_SPEED * SPEED_SCALE;
    for (let i = world.planets.length - 1; i >= 0; i--) {
      const p = world.planets[i];
      const dx = p.x - ship.x, dy = p.y - ship.y;
      if (dx * dx + dy * dy < (p.r + 190) * (p.r + 190)) world.planets.splice(i, 1);
    }
    for (let i = world.rocks.length - 1; i >= 0; i--) {
      const k = world.rocks[i];
      const dx = k.x - ship.x, dy = k.y - ship.y;
      if (dx * dx + dy * dy < 330 * 330) world.rocks.splice(i, 1);
    }
    burst(ship.x, ship.y, 30, { color: '#5CE1E6', maxSpeed: 300, maxLife: 0.9 });
  }
});

/* =========================================================
   16. BOOT
   ========================================================= */

// Exposed purely so automated playtests can drive and inspect a run.
window.__gen = generateAhead;
window.__perigee = { ship: ship, run: run, world: world, cam: cam, view: view, input: input, STATE: STATE, waves: waves, POWERS: POWERS, pal: pal, ZONES: ZONES, begin: function () { beginRun(); }, __HALF: function () { return HALF_H; } };

boot();
})();
</script>
</body>
</html>
