/* =========================================================
   SKY — palette climbs with altitude: dusk, thin air, space
   ========================================================= */

const SKY = [
  { at:0,    top:[42,26,64],  mid:[92,44,58],  low:[196,96,58],  star:0.0 },
  { at:600,  top:[16,26,72],  mid:[30,52,104], low:[56,92,150],  star:0.25 },
  { at:1600, top:[7,12,38],   mid:[12,22,60],  low:[22,38,86],   star:0.7 },
  { at:3200, top:[3,4,14],    mid:[5,7,22],    low:[9,12,34],    star:1.0 }
];
const sky = { top:[0,0,0], mid:[0,0,0], low:[0,0,0], star:0 };
function mix3(a,b,t){ return [ (a[0]+(b[0]-a[0])*t)|0, (a[1]+(b[1]-a[1])*t)|0, (a[2]+(b[2]-a[2])*t)|0 ]; }
function css(c,a){ return a===undefined ? 'rgb('+c[0]+','+c[1]+','+c[2]+')' : 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function updateSky(m) {
  let i = 0;
  while (i < SKY.length-2 && m > SKY[i+1].at) i++;
  const a = SKY[i], b = SKY[i+1];
  const t = clamp((m - a.at) / (b.at - a.at), 0, 1);
  sky.top = mix3(a.top,b.top,t); sky.mid = mix3(a.mid,b.mid,t);
  sky.low = mix3(a.low,b.low,t); sky.star = lerp(a.star,b.star,t);
}

const stars = [];
for (let i = 0; i < 90; i++) {
  stars.push({ x: Math.random(), y: Math.random(), r: rand(0.6,2.1), tw: Math.random()*TAU, d: rand(0.12,0.5) });
}

/* =========================================================
   RENDER
   ========================================================= */

function drawSky(t) {
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.fillStyle = '#05060D';
  ctx.fillRect(0,0,view.w,view.h);
  const g = ctx.createLinearGradient(0, view.py, 0, view.py + view.ph);
  g.addColorStop(0, css(sky.top)); g.addColorStop(0.55, css(sky.mid)); g.addColorStop(1, css(sky.low));
  ctx.fillStyle = g;
  ctx.fillRect(view.px, view.py, view.pw, view.ph);

  if (sky.star > 0.02) {
    for (const s of stars) {
      const yy = ((s.y + (-cam.y * s.d) / 4200) % 1 + 1) % 1;
      const tw = 0.6 + 0.4*Math.sin(t*1.7 + s.tw);
      ctx.globalAlpha = sky.star * tw * 0.9;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(view.px + s.x*view.pw, view.py + yy*view.ph, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function toWorld() {
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.beginPath();
  ctx.rect(view.px, view.py, view.pw, view.ph);
  ctx.clip();
  const sx = run.shake>0 ? rand(-1,1)*run.shake*12 : 0;
  const sy = run.shake>0 ? rand(-1,1)*run.shake*12 : 0;
  ctx.translate(view.px + view.pw/2 + sx, view.py + view.ph/2 + sy);
  ctx.scale(view.scale, view.scale);
  ctx.translate(0, -cam.y);
}

function drawWalls(t) {
  const top = cam.y - view.visH/2 - 60, bot = cam.y + view.visH/2 + 60;
  for (const side of [-1,1]) {
    const x = side * HALF_W;
    const g = ctx.createLinearGradient(x - side*46, 0, x, 0);
    g.addColorStop(0,'rgba(88,215,255,0)'); g.addColorStop(1,'rgba(88,215,255,0.14)');
    ctx.fillStyle = g;
    ctx.fillRect(Math.min(x, x - side*46), top, 46, bot-top);
    // The wall itself: opaque from the boundary line out to the glass (the
    // canvas clips at the play rect), a lit inner edge, tick marks on the face.
    const face = ctx.createLinearGradient(x, 0, x + side*40, 0);
    face.addColorStop(0, '#0E1D33'); face.addColorStop(1, '#05070F');
    ctx.fillStyle = face;
    ctx.fillRect(side < 0 ? x - 160 : x, top, 160, bot - top);
    ctx.strokeStyle = 'rgba(88,215,255,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bot); ctx.stroke();
    ctx.strokeStyle = 'rgba(88,215,255,0.28)'; ctx.lineWidth = 2;
    const per = 76, off = ((-cam.y*0.5) % per + per) % per;
    ctx.beginPath();
    for (let y = Math.floor(top/per)*per - off; y < bot; y += per) {
      ctx.moveTo(x + side*6, y); ctx.lineTo(x + side*24, y + 20);
    }
    ctx.stroke();
  }
}

function drawBar(b) {
  const yy = b.y;
  ctx.fillStyle = 'rgba(255,77,109,0.16)';
  ctx.fillRect(-HALF_W, yy-13, WORLD_W, 26);
  ctx.strokeStyle = 'rgba(255,77,109,0.9)'; ctx.lineWidth = 3;
  for (const seg of [[-HALF_W, b.gx-b.gw/2],[b.gx+b.gw/2, HALF_W]]) {
    ctx.beginPath(); ctx.moveTo(seg[0], yy); ctx.lineTo(seg[1], yy); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,77,109,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = seg[0]+12; x < seg[1]-6; x += 26) { ctx.moveTo(x, yy-11); ctx.lineTo(x+11, yy+11); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,77,109,0.9)'; ctx.lineWidth = 3;
  }
  // Gap posts
  ctx.strokeStyle = '#7CFFB2'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const gx of [b.gx-b.gw/2, b.gx+b.gw/2]) {
    ctx.beginPath(); ctx.moveTo(gx, yy-17); ctx.lineTo(gx, yy+17); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createLinearGradient(0, yy-30, 0, yy+30);
  lg.addColorStop(0,'rgba(124,255,178,0)'); lg.addColorStop(0.5,'rgba(124,255,178,0.22)'); lg.addColorStop(1,'rgba(124,255,178,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(b.gx-b.gw/2, yy-30, b.gw, 60);
  ctx.globalCompositeOperation = 'source-over';
}

function drawPole(p, t) {
  const pulse = 0.5 + 0.5*Math.sin(t*2.2 + p.spin);
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.06 + p.glow*0.28 + pulse*0.03) + ')';
  ctx.lineWidth = 1.5; ctx.setLineDash([8,12]);
  ctx.lineDashOffset = -t * (p.glow>0.01 ? 40 : 14);
  ctx.beginPath(); ctx.arc(p.x, p.y, p.cap, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);

  if (p.glow > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    const hg = ctx.createRadialGradient(p.x,p.y,p.r*0.6,p.x,p.y,p.cap);
    hg.addColorStop(0, css(hexRGB(p.core), 0.22*p.glow)); hg.addColorStop(1, css(hexRGB(p.core), 0));
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(p.x,p.y,p.cap,0,TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  const bg = ctx.createRadialGradient(p.x-p.r*0.3, p.y-p.r*0.3, p.r*0.1, p.x, p.y, p.r);
  bg.addColorStop(0, p.core); bg.addColorStop(1, p.edge);
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r-0.7,0,TAU); ctx.stroke();

  if (p.key === 'boost') {
    ctx.globalCompositeOperation = 'lighter';
    const b = 0.4+0.6*Math.abs(Math.sin(t*3.2+p.spin));
    ctx.fillStyle = 'rgba(124,255,178,'+(0.3*b)+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.2+0.3*b),0,TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

function drawOrb(o, t) {
  if (o.got) return;
  const r = 7 + Math.sin(t*3+o.bob)*1.3;
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,217,138,0.22)';
  ctx.beginPath(); ctx.arc(o.x,o.y,r*2.3,0,TAU); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#FFD98A'; ctx.beginPath(); ctx.arc(o.x,o.y,r,0,TAU); ctx.fill();
}

// A cone of compressed air behind the player while the boom is running.
function drawBoom(t) {
  if (run.boom <= 0) return;
  const k = clamp(run.boom / BOOM_TIME, 0, 1);
  const len = view.visH * (0.30 + 0.35*k);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(0, P.y, 0, P.y + len);
  g.addColorStop(0, 'rgba(220,245,255,0.60)');
  g.addColorStop(0.35, 'rgba(88,215,255,0.30)');
  g.addColorStop(1, 'rgba(88,215,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(P.x - 9, P.y);
  ctx.lineTo(P.x + 9, P.y);
  ctx.lineTo(P.x + 46 + 10*Math.sin(t*30), P.y + len);
  ctx.lineTo(P.x - 46 - 10*Math.sin(t*30), P.y + len);
  ctx.closePath(); ctx.fill();
  // Mach rings peeling off the nose.
  for (let i = 0; i < 3; i++) {
    const a = ((t*2.6 + i/3) % 1);
    ctx.strokeStyle = 'rgba(220,245,255,' + (0.42*(1-a)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(P.x, P.y + 26 + a*150, 16 + a*70, 7 + a*26, 0, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTether(t) {
  if (!P.anchor) return;
  const p = P.anchor;
  ctx.strokeStyle = 'rgba(124,255,178,0.55)';
  ctx.lineWidth = 2; ctx.setLineDash([6,7]); ctx.lineDashOffset = -t*34;
  ctx.beginPath(); ctx.moveTo(P.x,P.y); ctx.lineTo(p.x,p.y); ctx.stroke();
  ctx.setLineDash([]);
}

function drawPlayer(t) {
  if (run.state === STATE.DEAD) return;
  const blink = run.invuln > 0 && Math.floor(t*18)%2===0;
  if (blink) return;
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(P.dir + Math.PI/2);

  // Jet flame, length tracks remaining thrust
  const f = P.anchor ? clamp(speed()/(V_MAX*view.speedScale), 0, 1) : 0;
  if (f > 0.02) {
    ctx.globalCompositeOperation='lighter';
    const fl = 16 + f*30 + Math.sin(t*40)*3;
    const fg = ctx.createLinearGradient(0, BODY_R*0.6, 0, BODY_R*0.6+fl);
    fg.addColorStop(0,'rgba(255,235,160,0.95)');
    fg.addColorStop(0.4,'rgba(124,255,178,0.6)');
    fg.addColorStop(1,'rgba(88,215,255,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-6, BODY_R*0.5); ctx.lineTo(6, BODY_R*0.5);
    ctx.lineTo(0, BODY_R*0.5+fl); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }

  ctx.globalCompositeOperation='lighter';
  const g = ctx.createRadialGradient(0,0,0,0,0,BODY_R*3.4);
  g.addColorStop(0, falling() ? 'rgba(255,120,140,0.5)' : 'rgba(160,255,210,0.45)');
  g.addColorStop(1,'rgba(160,255,210,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,BODY_R*3.4,0,TAU); ctx.fill();
  ctx.globalCompositeOperation='source-over';

  ctx.beginPath();
  ctx.moveTo(0, -BODY_R*1.5);
  ctx.lineTo(BODY_R*0.85, BODY_R*0.7);
  ctx.lineTo(0, BODY_R*0.3);
  ctx.lineTo(-BODY_R*0.85, BODY_R*0.7);
  ctx.closePath();
  ctx.fillStyle = '#F6F1E8'; ctx.fill();
  ctx.strokeStyle = falling() ? '#FF4D6D' : '#7CFFB2'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawFx() {
  ctx.globalCompositeOperation='lighter';
  for (const w of waves) {
    if (w.age < 0) continue;
    const t = w.age/w.life, e = 1-Math.pow(1-t,3);
    ctx.strokeStyle = w.color; ctx.globalAlpha = Math.pow(1-t,1.7)*0.85;
    ctx.lineWidth = Math.max(0.6, w.width*(1-t*0.8));
    ctx.beginPath(); ctx.arc(w.x,w.y, w.r0+(w.maxR-w.r0)*e, 0, TAU); ctx.stroke();
  }
  for (const p of parts) {
    const a = 1-p.age/p.life;
    ctx.globalAlpha = a; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.4+a*0.6),0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

function drawEdges() {
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  // Danger vignette when you're low in the frame.
  const bottomY = cam.y + view.visH*0.5;
  const room = clamp((bottomY - P.y) / (view.visH*0.35), 0, 1);
  const danger = 1 - room;
  if (danger > 0.02) {
    const g = ctx.createLinearGradient(0, view.py+view.ph, 0, view.py+view.ph*0.62);
    g.addColorStop(0,'rgba(255,77,109,'+(0.55*danger)+')');
    g.addColorStop(1,'rgba(255,77,109,0)');
    ctx.fillStyle = g; ctx.fillRect(view.px, view.py+view.ph*0.62, view.pw, view.ph*0.38);
  }
  if (run.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,'+(run.flash*0.3)+')';
    ctx.fillRect(view.px, view.py, view.pw, view.ph);
  }
  // Letterbox surround
  if (view.px > 0) {
    ctx.fillStyle = '#05060D';
    ctx.fillRect(0,0,view.px,view.h);
    ctx.fillRect(view.px+view.pw,0,view.w-view.px-view.pw,view.h);
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(view.px+.5,0); ctx.lineTo(view.px+.5,view.h);
    ctx.moveTo(view.px+view.pw-.5,0); ctx.lineTo(view.px+view.pw-.5,view.h);
    ctx.stroke();
  }
}

function render(t) {
  drawSky(t);
  ctx.save();
  toWorld();
  drawWalls(t);
  for (const b of world.bars) drawBar(b);
  for (const p of world.poles) drawPole(p, t);
  for (const o of world.orbs) drawOrb(o, t);
  drawBoom(t);
  Tutor.draw(t);
  drawTether(t);
  drawFx();
  drawPlayer(t);
  ctx.restore();
  drawEdges();
}

/* =========================================================
   HUD
   ========================================================= */

const hudAlt = el('altV'), hudNum = el('spdNum'), hudFill = el('spdFill'), hudBar = el('bar');
const boostBtn = el('boost');
boostBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fireBoom(); });
let shownAlt = 0, shownOrbs = 0;

function syncHUD(dt) {
  const m = metres();
  shownAlt = lerp(shownAlt, m, 1-Math.exp(-10*dt));
  hudAlt.textContent = Math.round(shownAlt).toLocaleString();

  // The bar is your CLIMB rate, which is the thing gravity actually drains.
  // Raw speed would rise as you fall, which reads exactly backwards.
  const max = V_MAX * view.speedScale;
  const f = clamp(climb() / max, 0, 1);
  hudFill.style.width = (f*100).toFixed(1) + '%';
  hudNum.textContent = Math.round(speed());
  hudFill.style.backgroundColor = f > 0.42 ? 'var(--thrust)' : f > 0.16 ? 'var(--warn)' : 'var(--danger)';
  hudBar.classList.toggle('empty', falling());

  const full = run.orbs >= ORB_CHARGE;
  boostBtn.style.setProperty('--p', run.power.toFixed(3));
  if (Math.floor(run.orbs) > Math.floor(shownOrbs) && !full) boostBtn.animate([{ transform:'scale(1.05)' }, { transform:'scale(.85)' }], { duration:220, easing:'ease-out' });
  shownOrbs = run.orbs;
  boostBtn.classList.toggle('on', full && run.boom <= 0 && run.state === STATE.PLAY && !run.awaitFirst);

  if (run.chain >= 3 && run.state === STATE.PLAY) {
    el('chain').textContent = 'CHAIN ' + run.chain + '  ×' + multiplier().toFixed(1);
    el('chain').classList.add('on');
  } else if (!bannerShown()) el('chain').classList.remove('on');
}

/* =========================================================
   KERNEL HOOKS — everything the shared loop asks of this game
   ========================================================= */

Object.assign(G, {
  layout() {
    // Fill the height, cap the width — full-bleed on a phone, a centred
    // column on desktop. Never blocks landscape; it just letterboxes.
    view.ph = view.h;
    view.pw = Math.min(view.w, view.h * PLAY_RATIO);
    view.px = (view.w - view.pw) / 2;
    view.py = 0;
    view.scale = view.pw / (WORLD_W + 36);   // 18 world units of wall each side (was 36)
    view.visH = view.ph / view.scale;
    // Keep time-to-cross-the-screen consistent across shapes. Derived from the
    // ORIGINAL 72-unit frame, not the visible one: the wall width is a look,
    // and speed must not change when it does (see CLAUDE.md, invariant 2).
    view.speedScale = clamp((view.ph / (view.pw / (WORLD_W + 72))) / 1340, 0.72, 1.15);

    for (const l of [el('hud'), el('intro'), el('over'), el('paused')]) {
      l.style.left = view.px + 'px'; l.style.top = view.py + 'px';
      l.style.width = view.pw + 'px'; l.style.height = view.ph + 'px';
    }
    el('corner').style.right = (view.px + 14) + 'px';
  },

  reset(teach) {
    resetWorld();
    P.x = 0; P.y = 0; P.dir = -Math.PI/2;
    P.vx = 0; P.vy = -V_LAUNCH * view.speedScale;
    P.anchor = null; P.lockout = null; P.arc = 0; P.omega = 0;
    run.alt = 0; run.top = 0; run.slings = 0; run.chain = 0;
    el('chain').classList.remove('on');   // a chain shown at death must not stick into the next run
    run.freeT = 0; run.invuln = 0.5;
    run.nextMile = 250; run.warned = false;
    run.orbs = 0; run.power = 0; run.boom = 0; run.everFull = false; run.coachBoost = false;
    cam.y = 0;
    generateAhead(-view.visH * 2.2, 0);
    el('introBest').textContent = run.best ? 'Best ' + run.best.toLocaleString() + ' m' : '';
    Tutor.start(teach);
  },

  decay(dt) { for (const p of world.poles) p.glow = Math.max(0, p.glow - dt*3.2); },
  idle(dt, clock) { P.y = Math.sin(clock*1.9)*6; updateSky(0); },
  slow(dt) { Tutor.update(dt); return run.coachBoost ? TUTOR_SLOW : Tutor.scale; },   // coaching slows the world, not the UI
  dead(dt) { cam.y -= 8*dt; },
  syncHUD: syncHUD,
  render: render,

  step(dt) {
    stepPlayer(dt);

    // Camera rises with you and never falls back, plus a slow creep so
    // hovering on one pole isn't a strategy.
    const target = P.y - view.visH * (run.boom > 0 ? 0.26 : 0.12);
    if (target < cam.y) cam.y = lerp(cam.y, target, 1-Math.exp(-(run.boom > 0 ? 16 : 5)*dt));
    cam.y -= view.visH * (0.010 + Math.min(0.028, metres()*0.00004)) * (P.anchor ? 0.35 : 1) * dt;

    // Altitude gained is the score, and only once you've actually slung.
    if (P.y < run.top) {
      const gained = (run.top - P.y) / 10;
      if (run.engaged) run.score += gained * multiplier();
      if (run.boom <= 0) charge(gained * CLIMB_CHARGE);   // the boom must not refuel itself
      run.top = P.y;
    }
    run.alt = metres();
    updateSky(run.alt);

    if (run.alt >= run.nextMile) {
      run.nextMile += 250;
      if (run.engaged) run.score += Math.round(120*multiplier());
      banner(Math.round(run.alt) + ' M', '#7CFFB2');
      shockwave(P.x, P.y, { maxR:view.visH*0.45, life:0.85, color:'#7CFFB2', width:6 });
      run.flash = Math.max(run.flash, 0.18);
      Sound.milestone();
    }

    generateAhead(cam.y - view.visH*1.6, run.alt);
    cullBelow(cam.y + view.visH*0.9);
    checkCollisions();

    Music.set(run.alt, falling(), run.chain);

    if (Sound.jet) {
      const f = clamp(speed()/(V_MAX*view.speedScale), 0, 1);
      Sound.setJet(P.anchor ? f * 0.9 : 0, f);
    }
  },

  wake() { Sound.startJet(); Music.start(); },
  hush() { Sound.stopJet(); Music.stop(); },

  launch() {
    burst(P.x, P.y, 26, { color:'#7CFFB2', angle:Math.PI/2, spread:0.7, maxSpeed:340, maxLife:0.7 });
    shockwave(P.x, P.y, { maxR:230, life:0.7, color:'#7CFFB2', width:6 });
    Sound.sling(1);
  },

  key(e) { if (e.code === 'KeyB') fireBoom(); },


  dying() { Tutor.suspend(); return false; },
  crash() {
    P.anchor = null;
    shockwave(P.x, P.y, { maxR: view.visH*0.5, life:0.9, color:'#FF4D6D', width:8 });
    shockwave(P.x, P.y, { maxR: view.visH*0.3, life:0.7, color:'#FFC24D', width:5, delay:0.1 });
    burst(P.x, P.y, 42, { color:'#FF4D6D', maxSpeed:400, maxLife:1.1, maxR:4.4 });
  },
  celebrate(i) {
    const a = rand(0, TAU), r = i ? rand(60, 200) : 0;
    const x = P.x + Math.cos(a) * r, y = P.y + Math.sin(a) * r;
    burst(x, y, 26, { color: i % 2 ? '#FFFFFF' : '#FFD98A', minSpeed: 120, maxSpeed: 360,
                      minLife: 0.6, maxLife: 1.3, maxR: 3.8, drag: 1.2 });
    shockwave(x, y, { maxR: 140 + i * 30, life: 0.6, color: '#FFD98A', width: 3 });
  },
  record() {
    const m = Math.floor(metres());
    const isBest = m > run.best;
    if (isBest) { run.best = m; store('slinger.best', String(run.best)); }
    return isBest;
  },
  overPanel() {
    el('finalAlt').innerHTML = Math.floor(metres()).toLocaleString() + '<span class="score-unit">m</span>';
    el('finalSlings').textContent = run.slings;
    el('finalChain').textContent = run.bestChain;
  },

  revive() {
    run.invuln = 1.5;
    P.anchor = null; P.lockout = null; P.omega = 0;
    P.vx = 0; P.vy = -V_LAUNCH * view.speedScale; P.dir = -Math.PI/2;
    P.y = cam.y; P.x = clamp(P.x, -HALF_W+80, HALF_W-80);
    for (let i = world.bars.length-1; i>=0; i--) if (Math.abs(world.bars[i].y - P.y) < 420) world.bars.splice(i,1);
    for (let i = world.poles.length-1; i>=0; i--) {
      const q = world.poles[i], dx = q.x-P.x, dy = q.y-P.y;
      if (dx*dx+dy*dy < 200*200) world.poles.splice(i,1);
    }
    burst(P.x, P.y, 28, { color:'#7CFFB2', maxSpeed:300, maxLife:0.8 });
  }
});

/* =========================================================
   BOOT
   ========================================================= */

window.__slinger = { Music:Music, P:P, run:run, world:world, cam:cam, view:view, input:input, STATE:STATE,
                     begin: function(){ beginRun(); },
                     restart: function(t){ startRun(t); }, Tutor: Tutor, sky: sky,
                     charge: function(n){ charge(n); }, boom: function(){ fireBoom(); },
                     Portal: Portal };

boot();
})();
</script>
</body>
</html>
